<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123e35"><title>Moș Crăciun Sună</title><link rel="manifest" href="manifest.webmanifest"><style>body{margin:0;background:radial-gradient(circle at top,#286d58,#102d2a 75%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100dvh;text-align:center}main{max-width:480px;margin:auto;padding:55px 20px 30px}h1{font-size:32px}p{line-height:1.5}.santa{font-size:105px;margin:35px 0}.card{background:#ffffff17;border:1px solid #ffffff33;border-radius:24px;padding:24px}button{background:#db3d42;color:white;border:0;border-radius:999px;padding:17px 28px;font-size:18px;font-weight:700;margin:12px;cursor:pointer}button.secondary{background:#ffffff25}video{width:100%;border-radius:18px;background:#091b18;max-height:55dvh}#call,#done{display:none}#status{min-height:44px}small{opacity:.8}</style></head><body><main><section id="home"><div class="santa">🎅</div><h1>Moș Crăciun Sună</h1><p>Un apel magic de la Polul Nord!</p><div class="card"><button id="start">📞 Sună-l pe Moș Crăciun</button><p><small>Apelul este o înregistrare, nu o conversație în direct.</small></p></div></section><section id="call"><h1>🎄 Moș Crăciun</h1><video id="video" playsinline preload="auto" poster=""></video><p id="status">Se conectează apelul...</p><button id="continue" class="secondary" style="display:none">▶ Continuă</button><button id="hangup">📵 Închide</button></section><section id="done"><div class="santa">🎁</div><h1>Crăciun fericit!</h1><p>Ho, ho, ho! Ne vedem curând!</p><button id="again">Sună din nou</button></section></main><script>
const clips=['mos-1.mp4','mos-2.mp4','mos-3.mp4','mos-4.mp4'];const pauses=[6000,20000,0];let index=0,timer=null;const $=id=>document.getElementById(id),video=$('video');function show(id){['home','call','done'].forEach(x=>$(x).style.display=x===id?'block':'none')}function finish(){clearTimeout(timer);video.pause();show('done')}function playClip(){if(index>=clips.length){finish();return}video.src=clips[index];video.load();$('continue').style.display='none';$('status').textContent='Moș Crăciun vorbește...';video.play().catch(()=>{$('status').textContent='Apasă pe Continuă pentru a porni videoclipul.';$('continue').style.display='inline-block'})}function next(){clearTimeout(timer);index++;playClip()}function start(){index=0;show('call');playClip()}video.addEventListener('ended',()=>{if(index===clips.length-1){finish();return}const seconds=pauses[index]/1000;$('status').textContent=seconds===20?'Acum poți cânta un colind! 🎶':'Acum poți răspunde lui Moș Crăciun! 🎤';$('continue').style.display='inline-block';timer=setTimeout(next,pauses[index])});video.addEventListener('error',()=>{$('status').textContent='Lipsește videoclipul '+clips[index]+'. Adaugă cele patru fișiere video pentru a activa apelul.';$('continue').style.display='none'});$('start').onclick=start;$('again').onclick=start;$('hangup').onclick=finish;$('continue').onclick=()=>{if(video.paused&&video.currentTime===0){video.play().catch(()=>{})}else next()};
</script></body></html>
